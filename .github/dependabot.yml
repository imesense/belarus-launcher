version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: default
    groups:
      actions-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    target-branch: default
    groups:
      actions-minor:
        update-types:
          - minor
          - patch
